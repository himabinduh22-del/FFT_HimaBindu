<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java script Grade Calculator</title>
    
<style> 
body{
    font-family: Arial;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    padding: 20px;
}
.box{
    background: white;
    padding: 20px;
    width: 350px;
    border-radius: 8px;
    box-shadow: 0 0 10px gray;
}
h2{
    text-align: center;
}
input{
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    box-sizing: border-box;
}
button{
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}
.reset{
    background: red;
}
#result{
    margin-top: 15px;
    padding: 10px;
    background: #e8f5e9;
    display: none;
}
</style>
</head> 
<body>
    <div class="box">
        <h2>Grade Calculator</h2>
        
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter Name">

        <label>Subject Marks (0-100)</label>
        <input type="number" id="s1" placeholder="Subject 1">
        <input type="number" id="s2" placeholder="Subject 2">
        <input type="number" id="s3" placeholder="Subject 3">
        <input type="number" id="s4" placeholder="Subject 4">
        <input type="number" id="s5" placeholder="Subject 5">

        <button onclick="calculate()">Calculate</button>
        <button onclick="resetAll()" class="reset">Reset</button>

        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
</body>
</html>
