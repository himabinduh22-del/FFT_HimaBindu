<html>
    <head>
        <title>Krishna Special</title>
        <style>

            }
            img{

                margin-left: auto;
                margin-right: auto;
                display: block;
                /*transition: 1s;*/
                animation: kanna 3s ease-in-out alternate infinite;
                /* animation-duration: 2s;
                animation-timing-function: ease;
                animation-delay: 2s;
                animation-direction: alternate;
                animation-iteration-count: infinite;
                animation-iteration-count:infinite; */
            }
            @keyframes kanna{
                from{
                    transform: scale(0);
                }to{
                    transform: scale(300px);
                }
            }
           /* img:hover{
                transform: scale(1.7);
            }*/

            div{
                border: 5px solid black;
                background: aliceblue;
                box-shadow:0 5px 10px black;
            }
        </style>
    </head>
    <body>
        <div>
        <h1>krishna special</h1>
        <img src="krishna.jpg" alt="lord krishna">
     
    </body>
