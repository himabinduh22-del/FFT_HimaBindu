<html>
    <head>
        <title>Transitions&Animations</title>
        <style>
            button{
                margin-left: 100px;
                width: 100px;
                height: 50px;
                background: blueviolet;
                border: none;
                border-radius: 15px;
                transition: 5s;
            }
            button:hover{
                background: blue;
                transform: scale(1.1);
            }
            .box{
                width: 100px;
                height: 100px;
                background: burlywood;
                /*animation-name: Manaswini;
                animation-delay: 1s;
                animation-timing-function: ease;
                animation-duration: 2s;
                animation-iteration-count: infinite;*/
                animation: Manaswini 1s ease 2s infinite;

            }
            @keyframes Manaswini{
               to{
                transform: scale(0);
               }
               From{
                transform: scale(300px);
               }
            }
            
            .load{
                width: 100px;
                height: 100px;
                border:5px solid gray;
                border-radius :50px;
                border-top: 5px solid blueviolet;
                animation: spin 1s linear infinite;
            }
            @keyframes spin{
                to{
                    transform: rotate(360deg);
                }
                from{

                }
            }
            .rectangle{
                width: 100px;
                height: 100px;border: 10px solid black;                
                border-top: 10px solid rgb(171, 212, 239);
                animation: spin 1s ease 2s infinite;
            }
            @keyframes spin{
                to{
                    transform: rotate(360deg);
                }
            }
            .diamond{
                width: 100px;
                height: 100px;
                border: 10px solid rgb(218, 161, 75);
                border-radius: 100px;
                border-top: 10px solid rgb(72, 31, 194);
                animation: spin 1s linear infinite;

            }
            @keyframes spin{
                to{
                    transform:rotate(360deg);
                }
            }

            
        </style>
    </head>
    <body>
        <h1>Transitions&Animations</h1>
        <button>Action</button><br><br>
        <div class="box"></div><br><br>
        <div class="load"></div><br><br>
        <div class="rectangle"></div><br><br>
        <div class="diamond"></div>
    </body>
</html>
